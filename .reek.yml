detectors:
  Attribute:
    enabled: false

  BooleanParameter:
    enabled: false

  ControlParameter:
    enabled: false

  DataClump:
    enabled: false

  DuplicateMethodCall:
    enabled: false

  FeatureEnvy:
    enabled: false

  IrresponsibleModule:
    enabled: false

  LongParameterList:
    enabled: false

  ManualDispatch:
    enabled: false

  NestedIterators:
    enabled: false

  NilCheck:
    enabled: false

  RepeatedConditional:
    enabled: false

  TooManyMethods:
    enabled: false

  TooManyStatements:
    enabled: false

  UncommunicativeVariableName:
    enabled: false

  UnusedParameters:
    enabled: false

  UtilityFunction:
    enabled: false

  # Baseline of warnings that predate whole-repo reek in CI (2026-10-31). Remove an
  # entry when its code is reworked.
  MissingSafeMethod:
    exclude:
      - 'ScaffoldingCommands' # validate_project! is a Thor command guard; a non-raising twin has no caller
  TooManyConstants:
    exclude:
      - 'RubyRaider::Ffmpeg' # pinned version, release URL and manifest constants

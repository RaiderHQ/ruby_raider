name: ffmpeg build

# Builds the four ffmpeg binaries that RubyRaider::Ffmpeg downloads for failure videos
# (.github/ffmpeg/build.sh), tests each one on a second runner, and uploads them as
# workflow artifacts. It never publishes: the ffmpeg-7.1 release is created by hand from
# the downloaded artifacts of one run, so the release bytes are the bytes MANIFEST pins.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/ffmpeg/**
      - .github/workflows/ffmpeg.yml

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkgconf
          .github/ffmpeg/build.sh ${{ matrix.target }} dist

      # Alpine/musl gives a fully static binary that runs on any x86_64 Linux.
      - name: Build (Linux, Alpine container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c '
            apk add --no-cache bash build-base nasm perl pkgconf git curl xz tar diffutils file ruby &&
            .github/ffmpeg/build.sh linux-x64 dist'

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: >-
            make diffutils git tar xz curl perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-ruby

      - name: Build (Windows, MSYS2 MINGW64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: .github/ffmpeg/build.sh windows-x64 dist

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-7.1-${{ matrix.target }}
          path: |
            dist/ffmpeg-7.1-*
            dist/BUILD-*.txt
            dist/COPYING.LGPLv2.1
            dist/libvpx-LICENSE
            dist/libvpx-PATENTS
            dist/zlib-LICENSE
          if-no-files-found: error
          retention-days: 90

  # Each binary on a runner it was not built on (older macOS, older glibc Linux, newer Windows),
  # running VideoHelper's exact encode.
  test:
    name: test ${{ matrix.target }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-14 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: windows-x64, os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-7.1-${{ matrix.target }}
          path: dist
      - name: Encode like VideoHelper
        run: |
          bin="dist/ffmpeg-7.1-${{ matrix.target }}"
          [ "${{ runner.os }}" = Windows ] && bin="$bin.exe"
          chmod +x "$bin"
          # Linkage was audited in the build job, where the toolchain's tools are.
          SKIP_LINKAGE=1 .github/ffmpeg/check.sh "$bin" "$RUNNER_TEMP/check"
          mv "$RUNNER_TEMP/check/video.webm" "video-${{ matrix.target }}.webm"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.target }}
          path: video-${{ matrix.target }}.webm
          retention-days: 14

  validate:
    name: validate videos and print checksums
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Probe every video with a reference ffprobe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          for video in artifacts/video-*/video-*.webm; do .github/ffmpeg/probe.sh "$(command -v ffprobe)" "$video"; done
      - name: Checksums for MANIFEST
        run: |
          {
            echo '### ffmpeg-7.1 assets'
            echo '```'
            cd artifacts && sha256sum ffmpeg-7.1-*/ffmpeg-7.1-*
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
